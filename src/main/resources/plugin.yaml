apiVersion: plugin.halo.run/v1alpha1
kind: Plugin
metadata:
  name: PluginMembers
spec:
  version: 1.4.4
  requires: ">=2.23.0"
  author:
    name: chenhufei
    website: https://github.com/chenhufei
  logo: logo.svg
  homepage: https://github.com/chenhufei/plugin-members
  repo: https://github.com/chenhufei/plugin-members
  issues: https://github.com/chenhufei/plugin-members/issues
  displayName: "成员管理"
  description: "为 Halo 提供成员分组、公示与访客自助申请，包含审核、撤回、通知、限流和主题集成能力。"
  license:
    - name: "GPL-3.0"
  configMapName: plugin-members-configmap
  settingName: plugin-members-settings
  enabled: true
