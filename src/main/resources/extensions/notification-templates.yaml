apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-submit
spec:
  reasonSelector:
    reasonType: admin-member-submit
    language: default
  template:
    title: "新的成员申请[(${autoApproved ? '已自动通过' : '待审核'})]"
    rawBody: |
      新的成员申请：
      账号名称：[(${displayName})]
      所属学校：[(${school})]
      QQ号：[(${qq})]
      邮箱：[(${email})]
      分组：[(${groupName})]
      当前状态：[(${autoApproved ? '已自动通过' : '待审核'})]
      审核入口：[(${reviewUrl})]
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;">
            <div style="font-size:13px;color:#64748b;">成员自助申请</div>
            <h2 style="margin:4px 0 0;font-size:20px;color:#111827;">新的成员申请</h2>
            <span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:600;" th:text="${autoApproved ? '已自动通过' : '待审核'}"></span>
          </div>
          <div style="padding:22px 24px;">
            <p style="margin:0 0 16px;" th:text="|${subscriber.displayName}，您好：|">您好：</p>
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;">账号名称</td><td style="padding:8px 0;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">所属学校</td><td style="padding:8px 0;" th:text="${school}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">QQ号</td><td style="padding:8px 0;" th:text="${qq}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">联系邮箱</td><td style="padding:8px 0;word-break:break-all;" th:text="${email}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">申请分组</td><td style="padding:8px 0;" th:text="${groupName}"></td></tr>
              <tr th:if="${website != null and website != ''}"><td style="padding:8px 0;color:#64748b;">网站</td><td style="padding:8px 0;word-break:break-all;" th:text="${website}"></td></tr>
              <tr th:if="${description != null and description != ''}"><td style="padding:8px 0;color:#64748b;vertical-align:top;">说明</td><td style="padding:8px 0;" th:text="${description}"></td></tr>
            </table>
            <p style="margin:20px 0 0;"><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 16px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600;">前往审核</a></p>
          </div>
        </div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-code
spec:
  reasonSelector:
    reasonType: user-member-withdraw-code
    language: default
  template:
    title: "您的成员撤回验证码"
    rawBody: |
      您的成员撤回验证码为：[(${code})]
      验证码有效期为 5 分钟，请勿向他人透露。
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;"><div style="font-size:13px;color:#64748b;">成员自助申请</div><h2 style="margin:4px 0 0;font-size:20px;color:#111827;">撤回验证码</h2></div>
          <div style="padding:22px 24px;text-align:center;">
            <p style="margin:0 0 12px;" th:text="|${subscriber.displayName}，您的验证码是：|"></p>
            <div style="display:inline-block;padding:10px 18px;border-radius:6px;background:#f1f5f9;color:#111827;font-size:26px;font-weight:700;letter-spacing:6px;" th:text="${code}"></div>
            <p style="margin:14px 0 0;color:#64748b;font-size:13px;">验证码 5 分钟内有效，请勿向他人透露。</p>
          </div>
        </div>
      </div>

---
