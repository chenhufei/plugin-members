      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;"><div style="font-size:13px;color:#64748b;">成员自助申请</div><h2 style="margin:4px 0 0;font-size:20px;color:#111827;">申请已通过</h2><span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:#ecfdf5;color:#047857;font-size:12px;font-weight:600;">已通过</span></div>
          <div style="padding:22px 24px;">
            <p style="margin:0 0 16px;" th:text="|${subscriber.displayName}，您好：|">您好：</p>
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;">账号名称</td><td style="padding:8px 0;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">所属学校</td><td style="padding:8px 0;" th:text="${school}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">QQ号</td><td style="padding:8px 0;" th:text="${qq}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">申请分组</td><td style="padding:8px 0;" th:text="${groupName}"></td></tr>
            </table>
            <div th:if="${reviewDescription != null and reviewDescription != ''}" style="margin-top:18px;padding:12px 14px;border-radius:6px;background:#f8fafc;border-left:4px solid #22c55e;"><div style="font-size:12px;color:#64748b;">审核说明</div><div style="margin-top:4px;" th:text="${reviewDescription}"></div></div>
            <p style="margin:20px 0 0;"><a th:href="${memberUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 16px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600;">查看成员页面</a></p>
          </div>
        </div>
      </div>

---
