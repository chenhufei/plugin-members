apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-withdraw
spec:
  reasonSelector:
    reasonType: admin-member-withdraw
    language: default
  template:
    title: "新的成员撤回申请待处理"
    rawBody: |
      账号名称：[(${displayName})]
      QQ号：[(${qq})]
      撤回邮箱：[(${withdrawEmail})]
      撤回原因：[(${withdrawReason})]
      撤回前状态：[(${statusBefore})]
      处理入口：[(${reviewUrl})]
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;"><div style="font-size:13px;color:#64748b;">成员自助申请</div><h2 style="margin:4px 0 0;font-size:20px;color:#111827;">新的撤回申请</h2><span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;background:#fff7ed;color:#c2410c;font-size:12px;font-weight:600;">待处理</span></div>
          <div style="padding:22px 24px;">
            <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;">
              <tr><td style="width:96px;padding:8px 0;color:#64748b;">账号名称</td><td style="padding:8px 0;font-weight:600;" th:text="${displayName}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">QQ号</td><td style="padding:8px 0;" th:text="${qq}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">撤回邮箱</td><td style="padding:8px 0;word-break:break-all;" th:text="${withdrawEmail}"></td></tr>
              <tr><td style="padding:8px 0;color:#64748b;">撤回前状态</td><td style="padding:8px 0;" th:text="${statusBefore}"></td></tr>
            </table>
            <div style="margin-top:18px;padding:12px 14px;border-radius:6px;background:#f8fafc;border-left:4px solid #94a3b8;"><div style="font-size:12px;color:#64748b;">撤回原因</div><div style="margin-top:4px;" th:text="${withdrawReason != null and withdrawReason != '' ? withdrawReason : '未填写'}"></div></div>
            <p style="margin:20px 0 0;"><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 16px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600;">处理撤回申请</a></p>
          </div>
        </div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-review
spec:
  reasonSelector:
    reasonType: user-member-withdraw-review
    language: default
  template:
    title: "您的成员撤回申请已处理"
    rawBody: |
      处理结果：[(${reviewResult == 'APPROVED' ? '已通过' : '未通过'})]
      当前状态：[(${status})]
      撤回原因：[(${withdrawReason})]
      成员页面：[(${reviewUrl})]
    htmlBody: |
      <div style="max-width:640px;margin:0 auto;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Microsoft YaHei',sans-serif;line-height:1.7;">
        <div style="border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;">
          <div style="padding:22px 24px;background:#f8fafc;border-bottom:1px solid #e5e7eb;"><div style="font-size:13px;color:#64748b;">成员自助申请</div><h2 style="margin:4px 0 0;font-size:20px;color:#111827;">撤回申请已处理</h2><span style="display:inline-block;margin-top:10px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;" th:style="${reviewResult == 'APPROVED' ? 'background:#ecfdf5;color:#047857;' : 'background:#fef2f2;color:#b91c1c;'}" th:text="${reviewResult == 'APPROVED' ? '已通过' : '未通过'}"></span></div>
          <div style="padding:22px 24px;">
            <p style="margin:0;" th:text="${reviewResult == 'APPROVED' ? '您的撤回申请已通过，成员信息已从公示页面下架。' : '您的撤回申请未通过，成员状态已恢复。'}"></p>
            <div th:if="${withdrawReason != null and withdrawReason != ''}" style="margin-top:18px;padding:12px 14px;border-radius:6px;background:#f8fafc;border-left:4px solid #94a3b8;"><div style="font-size:12px;color:#64748b;">撤回原因</div><div style="margin-top:4px;" th:text="${withdrawReason}"></div></div>
            <p th:if="${status != null and status != ''}" style="margin:16px 0 0;color:#64748b;" th:text="|当前状态：${status}|"></p>
            <p style="margin:20px 0 0;"><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer" style="display:inline-block;padding:9px 16px;border-radius:6px;background:#2563eb;color:#fff;text-decoration:none;font-weight:600;">查看成员页面</a></p>
          </div>
        </div>
      </div>
