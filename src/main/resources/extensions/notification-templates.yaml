apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-submit
spec:
  reasonSelector:
    reasonType: admin-member-submit
    language: default
  template:
    title: "有新的成员申请，请审核！"
    rawBody: |
      有新的成员申请，请审核：

      账号名称：${displayName}
      邮箱：${email}
      所属学校：${school}
      QQ号：${qq}
      分组：${groupName}

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific">${subscriber.displayName} 你好：</p>
        </div>
        <div class="body">
          <p>有新的成员申请，请审核：</p>
          <div class="summary">
            <p>账号名称：${displayName}</p>
            <p>邮箱：${email}</p>
            <p>所属学校：${school}</p>
            <p>QQ号：${qq}</p>
            <p>分组：${groupName}</p>
          </div>
          <p><a href="${reviewUrl}" target="_blank" rel="noopener noreferrer">前往查看</a></p>
        </div>
        <div></div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
