apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-submit
spec:
  reasonSelector:
    reasonType: admin-member-submit
    language: default
  template:
    title: "有新的成员申请，请审核！"
    rawBody: |
      有新的成员申请，请审核：

      账号名称：[(${displayName})]
      邮箱：[(${email})]
      所属学校：[(${school})]
      QQ号：[(${qq})]
      分组：[(${groupName})]

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <p>有新的成员申请，请审核：</p>
          <div class="summary">
            <p th:text="|账号名称：${displayName}|"></p>
            <p th:text="|邮箱：${email}|"></p>
            <p th:text="|所属学校：${school}|"></p>
            <p th:text="|QQ号：${qq}|"></p>
            <p th:text="|分组：${groupName}|"></p>
          </div>
          <p><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer">前往审核</a></p>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-code
spec:
  reasonSelector:
    reasonType: user-member-withdraw-code
    language: default
  template:
    title: "您的成员撤回验证码"
    rawBody: |
      您的成员撤回验证码为：[(${code})]
      验证码有效期为 5 分钟，请勿向他人透露。
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <p>您的成员撤回验证码为：</p>
          <p th:text="${code}" style="font-size: 24px; font-weight: 700; letter-spacing: 4px;"></p>
          <p>验证码有效期为 5 分钟，请勿向他人透露。</p>
        </div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-submit
spec:
  reasonSelector:
    reasonType: user-member-submit
    language: default
  template:
    title: "您的成员申请已提交。"
    rawBody: |
      [(${displayName})]，您的成员申请已提交，请等待审核！

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p th:text="|${displayName}，您的成员申请已提交，请等待审核！|"></p>
            <p><a th:href="${memberUrl}" target="_blank" rel="noopener noreferrer">查看成员页面</a></p>
          </div>
        </div>
        <div></div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-review-member-submit
spec:
  reasonSelector:
    reasonType: review-member-submit
    language: default
  template:
    title: "您的成员申请已审核完成。"
    rawBody: |
      您的成员申请已审核完成。

      审核描述：[(${reviewDescription})]

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p>您的成员申请已审核完成。</p>
            <p th:if="${reviewDescription != null and reviewDescription != ''}" th:text="|审核描述：${reviewDescription}|"></p>
            <p><a th:href="${memberUrl}" target="_blank" rel="noopener noreferrer">查看成员页面</a></p>
          </div>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-review-member-reject
spec:
  reasonSelector:
    reasonType: review-member-reject
    language: default
  template:
    title: "您的成员申请未通过审核。"
    rawBody: |
      您的成员申请未通过审核。
      拒绝理由：[(${reviewDescription})]
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p>很抱歉地通知您，您的成员申请未通过审核。</p>
            <p th:if="${reviewDescription != null and reviewDescription != ''}" th:text="|拒绝理由：${reviewDescription}|"></p>
            <p><a th:href="${memberUrl}" target="_blank" rel="noopener noreferrer">查看成员页面</a></p>
          </div>
        </div>
        <div></div>
      </div>

---
