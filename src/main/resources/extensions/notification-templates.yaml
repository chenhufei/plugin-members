  name: template-review-member-submit
spec:
  reasonSelector:
    reasonType: review-member-submit
    language: default
  template:
    title: "您的成员申请已通过"
    rawBody: |
      [(${displayName})]，您的成员申请已通过审核。
      所属学校：[(${school})]
      QQ号：[(${qq})]
      分组：[(${groupName})]
      审核说明：[(${reviewDescription != null and reviewDescription != '' ? reviewDescription : '无'})]
