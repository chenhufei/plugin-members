apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-submit
spec:
  reasonSelector:
    reasonType: admin-member-submit
    language: default
  template:
    title: "有新的成员申请，请审核！"
    rawBody: |
      有新的成员申请，请审核：

      账号名称：${reason.attributes.displayName}
      邮箱：${reason.attributes.email}
      所属学校：${reason.attributes.school}
      QQ号：${reason.attributes.qq}
      分组：${reason.attributes.groupName}

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <p>有新的成员申请，请审核：</p>
          <div class="summary">
            <p th:text="${'账号名称：' + reason.attributes.displayName}"></p>
            <p th:text="${'邮箱：' + reason.attributes.email}"></p>
            <p th:text="${'所属学校：' + reason.attributes.school}"></p>
            <p th:text="${'QQ号：' + reason.attributes.qq}"></p>
            <p th:text="${'分组：' + reason.attributes.groupName}"></p>
          </div>
          <p><a th:href="${reason.attributes.reviewUrl}" target="_blank" rel="noopener noreferrer">前往查看</a></p>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-code
spec:
  reasonSelector:
    reasonType: user-member-withdraw-code
    language: default
  template:
    title: "您的成员撤回验证码"
    rawBody: |
      您的成员撤回验证码为：${reason.attributes.code}
      验证码有效期为 5 分钟，请勿向他人透露。
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <p>您的成员撤回验证码为：</p>
          <p th:text="${reason.attributes.code}" style="font-size: 24px; font-weight: 700; letter-spacing: 4px;"></p>
          <p>验证码有效期为 5 分钟，请勿向他人透露。</p>
        </div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
