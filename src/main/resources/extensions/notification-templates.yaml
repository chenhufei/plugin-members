---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-withdraw
spec:
  reasonSelector:
    reasonType: admin-member-withdraw
    language: default
  template:
    title: "有新的成员撤回申请待处理"
    rawBody: |
      管理员您好，有用户提交了成员撤回申请：
      申请成员：[(${displayName})]
      QQ号：[(${qq})]
      撤回邮箱：[(${withdrawEmail})]
      撤回原因：[(${withdrawReason})]
      当前状态：[(${statusBefore})]
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific">管理员您好：</p>
        </div>
        <div class="body">
          <div class="summary">
            <p>有用户提交了成员撤回申请，请及时处理：</p>
            <ul>
              <li th:text="|申请成员：${displayName}|"></li>
              <li th:text="|QQ号：${qq}|"></li>
              <li th:text="|撤回邮箱：${withdrawEmail}|"></li>
              <li th:text="|撤回原因：${withdrawReason}|"></li>
              <li th:text="|当前状态：${statusBefore}|"></li>
            </ul>
            <p><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer">前往处理撤回申请</a></p>
          </div>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-review
spec:
  reasonSelector:
    reasonType: user-member-withdraw-review
    language: default
  template:
    title: "您的撤回申请已处理完成"
    rawBody: |
      您提交的成员撤回申请处理结果为：[(${reviewResult})]
      当前状态：[(${status})]
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p th:text="|您提交的成员撤回申请处理结果为：${reviewResult}|"></p>
            <p th:if="${status != null and status != ''}" th:text="|当前状态：${status}|"></p>
            <p th:if="${reviewResult == 'APPROVED'}">您的撤回申请已通过，成员信息已从公示页面下架。</p>
            <p th:if="${reviewResult == 'REJECTED'}">您的撤回申请未通过，成员状态已恢复为撤回前状态。</p>
            <p th:if="${withdrawReason != null and withdrawReason != ''}" th:text="|撤回原因：${withdrawReason}|"></p>
            <p><a th:href="${reviewUrl}" target="_blank" rel="noopener noreferrer">查看成员页面</a></p>
          </div>
        </div>
        <div></div>
      </div>
