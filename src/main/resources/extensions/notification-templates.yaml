        </div>
        <div></div>
      </div>
---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-review-member-submit
spec:
  reasonSelector:
    reasonType: review-member-submit
    language: default
  template:
    title: "您的成员申请已审核完成。"
    rawBody: |
      您的成员申请已审核完成。

      审核描述：${reason.attributes.reviewDescription}

    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p>您的成员申请已审核完成。</p>
            <p th:if="${reason.attributes.reviewDescription != null and reason.attributes.reviewDescription != ''}" th:text="${'审核描述：' + reason.attributes.reviewDescription}"></p>
          </div>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-review-member-reject
spec:
  reasonSelector:
    reasonType: review-member-reject
    language: default
  template:
    title: "您的成员申请未通过审核。"
    rawBody: |
      您的成员申请未通过审核。
      拒绝理由：${reason.attributes.reviewDescription}
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p>很抱歉地通知您，您的成员申请未通过审核。</p>
            <p th:if="${reason.attributes.reviewDescription != null and reason.attributes.reviewDescription != ''}" th:text="${'拒绝理由：' + reason.attributes.reviewDescription}"></p>
          </div>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-admin-member-withdraw
spec:
  reasonSelector:
    reasonType: admin-member-withdraw
    language: default
  template:
    title: "有新的成员撤回申请待处理"
    rawBody: |
      管理员您好，有用户提交了成员撤回申请：
      申请成员：${reason.attributes.displayName}
      QQ号：${reason.attributes.qq}
      撤回邮箱：${reason.attributes.withdrawEmail}
      撤回原因：${reason.attributes.withdrawReason}
      当前状态：${reason.attributes.statusBefore}
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific">管理员您好：</p>
        </div>
        <div class="body">
          <div class="summary">
            <p>有用户提交了成员撤回申请，请及时处理：</p>
            <ul>
              <li th:text="${'申请成员：' + reason.attributes.displayName}"></li>
              <li th:text="${'QQ号：' + reason.attributes.qq}"></li>
              <li th:text="${'撤回邮箱：' + reason.attributes.withdrawEmail}"></li>
              <li th:text="${'撤回原因：' + reason.attributes.withdrawReason}"></li>
              <li th:text="${'当前状态：' + reason.attributes.statusBefore}"></li>
            </ul>
          </div>
        </div>
        <div></div>
      </div>

---
apiVersion: notification.halo.run/v1alpha1
kind: NotificationTemplate
metadata:
  name: template-user-member-withdraw-review
spec:
  reasonSelector:
    reasonType: user-member-withdraw-review
    language: default
  template:
    title: "您的撤回申请已处理完成"
    rawBody: |
      您提交的成员撤回申请处理结果为：${reason.attributes.reviewResult}
      当前状态：${reason.attributes.status}
    htmlBody: |
      <div class="content">
        <div class="head">
          <p class="honorific" th:text="${subscriber.displayName + ' 你好：'}"></p>
        </div>
        <div class="body">
          <div class="summary">
            <p th:text="${'您提交的成员撤回申请处理结果为：' + reason.attributes.reviewResult}"></p>
            <p th:if="${reason.attributes.status != null and reason.attributes.status != ''}" th:text="${'当前状态：' + reason.attributes.status}"></p>
            <p th:if="${reason.attributes.reviewResult == 'APPROVED'}">您的撤回申请已通过，申请已恢复为待审核状态。请等待管理员重新审核。</p>
            <p th:if="${reason.attributes.reviewResult == 'REJECTED'}">您的撤回申请未通过，您的申请状态保持不变。</p>
          </div>
        </div>
        <div></div>
      </div>
