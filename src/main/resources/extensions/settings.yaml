apiVersion: v1alpha1
kind: Setting
metadata:
  name: plugin-members-settings
spec:
  forms:
    - group: basic
      label: 申请审核
      formSchema:
        - $formkit: switch
          name: autoApprove
          id: autoApprove
          key: autoApprove
          label: 自动通过申请
          help: 新成员申请提交后直接通过，适合无需人工审核的站点
          value: false
        - $formkit: switch
          name: autoApproveWithdraw
          id: autoApproveWithdraw
          key: autoApproveWithdraw
          label: 自动通过撤回
          help: 用户提交撤回申请后直接处理，无需管理员手动审核
          value: false
        - $formkit: select
          id: defaultGroupName
          name: defaultGroupName
          key: defaultGroupName
          label: 默认成员分组
          help: 申请未选择分组时自动归入该分组
          clearable: true
          action: /apis/member.plugin.halo.run/v1alpha1/membergroups
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
        - $formkit: select
          id: forbidSelectedGroupName
          name: forbidSelectedGroupName
          key: forbidSelectedGroupName
          label: 禁止申请的分组
          multiple: true
          clearable: true
          action: /apis/member.plugin.halo.run/v1alpha1/membergroups
          requestOption:
            method: GET
            pageField: page
            sizeField: size
            totalField: total
            itemsField: items
            labelField: spec.displayName
            valueField: metadata.name
          help: 这些分组不会出现在前台成员申请表中

    - group: notification
      label: 邮件通知
      formSchema:
        - $formkit: switch
          name: sendEmail
          id: sendEmail
          key: sendEmail
          label: 发送邮件通知
          help: 向管理员和申请人发送提交、通过、拒绝、下架与撤回结果
          value: false
        - $formkit: text
          if: $get(sendEmail).value === true
          id: adminEmail
          name: adminEmail
          key: adminEmail
          value: ""
          label: 管理员邮箱
          help: 用于接收新申请和撤回申请提醒
          validation: required|email

    - group: security
      label: 安全防护
      formSchema:
        - $formkit: switch
          id: enableRateLimit
          name: enableRateLimit
          key: enableRateLimit
          label: 启用提交限流
          help: 按客户端 IP 限制匿名提交频率，降低刷表和误操作风险
          value: true
        - $formkit: number
          if: $get(enableRateLimit).value === true
          id: maxRequestsPerMinute
          name: maxRequestsPerMinute
          key: maxRequestsPerMinute
          label: 每分钟最大提交次数
          help: 单个客户端 IP 每分钟最多允许提交的次数，建议 5-30
          value: 10
          validation: required|min:1|max:1000
        - $formkit: switch
          id: enableSecurityBlocklist
          name: enableSecurityBlocklist
          key: enableSecurityBlocklist
          label: 启用安全黑名单
          help: 按 IP 和 User-Agent 关键字拒绝匿名提交请求
          value: false
        - $formkit: textarea
          if: $get(enableSecurityBlocklist).value === true
          id: blockedIpList
          name: blockedIpList
          key: blockedIpList
          label: IP 黑名单
          help: 多个 IP 可使用换行或英文逗号分隔；默认不拦截 127.0.0.1
          value: ""
        - $formkit: textarea
          if: $get(enableSecurityBlocklist).value === true
          id: blockedUserAgentKeywords
          name: blockedUserAgentKeywords
          key: blockedUserAgentKeywords
          label: User-Agent 黑名单关键字
          help: 多个关键字可使用换行或英文逗号分隔，例如 scraper、python-requests
          value: ""
        - $formkit: switch
          if: $get(enableSecurityBlocklist).value === true
          id: rejectMissingUserAgent
          name: rejectMissingUserAgent
          key: rejectMissingUserAgent
          label: 拒绝空 User-Agent
          help: 默认关闭，避免误伤代理或特殊客户端
          value: false

    - group: integration
      label: QQ 信息
      formSchema:
        - $formkit: password
          id: uapisToken
          name: uapisToken
          key: uapisToken
          label: Uapis 密钥
          help: 用于通过 uapis.cn 获取 QQ 昵称；留空时使用无需密钥的降级接口
          value: ""
