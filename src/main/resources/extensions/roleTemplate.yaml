apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-member-view
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "成员"
    rbac.authorization.halo.run/display-name: "成员查看"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:members:view"]
rules:
  - apiGroups: [ "member.plugin.halo.run" ]
    resources: [ "members", "membergroups", "cronmembersubmits" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/members" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members" ]
    verbs: [ "get", "list" ]
  # MemberList uses the console query endpoint even for read-only users.
  - apiGroups: [ "console.api.member.plugin.halo.run" ]
    resources: [ "members" ]
    verbs: [ "get", "list" ]
  # /members/-/statistics/overall 解析为子资源 members/statistics，name 为 "-"。
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members/statistics" ]
    resourceNames: [ "-" ]
    verbs: [ "get" ]
---
apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-member-manage
  labels:
    halo.run/role-template: "true"
  annotations:
    rbac.authorization.halo.run/module: "成员"
    rbac.authorization.halo.run/display-name: "成员管理"
    rbac.authorization.halo.run/ui-permissions: |
      ["plugin:members:manage"]
    rbac.authorization.halo.run/dependencies: |
      ["role-template-member-view"]
rules:
  - apiGroups: [ "member.plugin.halo.run" ]
    resources: [ "members", "membergroups", "cronmembersubmits" ]
    verbs: [ "create", "patch", "update", "delete", "deletecollection" ]
  - apiGroups: [ "console.api.member.plugin.halo.run" ]
    resources: [ "members" ]
    verbs: [ "get", "list", "create" ]
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members" ]
    verbs: [ "create" ]
  # 批量与导出走 POST 子资源，Halo 解析为 members/{sub} + name "-" + verb create。
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources:
      - "members/batch-approve"
      - "members/batch-delete"
      - "members/batch-change-group"
      - "members/export-csv"
      - "members/export-json"
      - "members/import-csv"
    resourceNames: [ "-" ]
    verbs: [ "create" ]
  - apiGroups: [ "console.api.member.plugin.halo.run" ]
    resources: [ "members/withdraw-requests" ]
    resourceNames: [ "-" ]
    verbs: [ "get" ]
  - apiGroups: [ "console.api.member.plugin.halo.run" ]
    resources: [ "members/withdraw-approve", "members/withdraw-reject" ]
    resourceNames: [ "-" ]
    verbs: [ "create" ]
  # 认领管理已搬离 api.plugin.halo.run——Halo 核心 role-template-public-apis 给该分组授的是通配
  # resources:["*"] + get/list，插件规则拦不住任何 GET。改在 api.member.plugin.halo.run 下按子资源授权：
  # Halo 把 /members/-/claims 解析成 resource=members、subresource=claims、name="-"，
  # 规则里的 resources 要写成 "members/claims"，第 4 段（如 claims-generate）只是 subName，不参与匹配。
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members/claims", "members/incomplete" ]
    resourceNames: [ "-" ]
    verbs: [ "get" ]
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members/claims-generate", "members/claims-distribute" ]
    resourceNames: [ "-" ]
    verbs: [ "create" ]
  # 作废认领令牌作用在具体成员名上（/members/{name}/claim），不能限定 resourceNames。
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "members/claim" ]
    verbs: [ "delete" ]

---

apiVersion: v1alpha1
kind: Role
metadata:
  name: role-template-member-anonymous-public
  labels:
    halo.run/hidden: "true"
    halo.run/role-template: "true"
    rbac.authorization.halo.run/aggregate-to-anonymous: "true"
  annotations:
    rbac.authorization.halo.run/module: "成员"
    rbac.authorization.halo.run/display-name: "成员公开访问"
rules:
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "membergroups" ]
    verbs: [ "get", "list" ]
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "membersubmits" ]
    verbs: [ "create" ]
  # Halo 的 RBAC 把 /apis/{group}/{version}/{resource}/-/{sub} 解析成 resource/{sub} 子资源，
  # 并把 HTTP 方法映射为动词（POST→create），所以必须按子资源授权，nonResourceURLs 不会命中。
  - apiGroups: [ "api.member.plugin.halo.run" ]
    resources: [ "membersubmits/submit", "membersubmits/captcha" ]
    resourceNames: [ "-" ]
    verbs: [ "create" ]
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/members" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "get", "list" ]
  # 工作证分享图要的是可绘制字节：QQ 头像 CDN 没有 CORS 头，画布只能改走同源代理。
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/avatar" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "get" ]
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/membersubmits" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "create" ]
  # 自助认领：发送验证码 + 提交认领（/plugins/PluginMembers/claim/{token} 也落在 "plugins/claim" 上）
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/claim" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "create" ]
  # 认领页要读回令牌对应的成员信息与验证方式。
  # 注：这一条其实是冗余的——Halo 核心 role-template-public-apis 已给
  # api.plugin.halo.run 授了 resources:["*"] + get/list，匿名读该分组本来就是通的。
  # 显式留下这条是为了核心哪天收窄通配时认领页不至于突然 403。
  - apiGroups: [ "api.plugin.halo.run" ]
    resources: [ "plugins/claim" ]
    resourceNames: [ "PluginMembers" ]
    verbs: [ "get" ]
