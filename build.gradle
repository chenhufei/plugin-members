plugins {
    id "com.github.node-gradle.node" version "7.1.0"
    id "run.halo.plugin.devtools" version "0.6.2"
    id "io.freefair.lombok" version "9.1.0"
    id 'java'
}

group 'run.halo.members'
version '1.3.3'

repositories {
    mavenCentral()
}

dependencies {
    implementation platform('run.halo.tools.platform:plugin:2.23.0')
    compileOnly 'run.halo.app:api'

    testImplementation 'run.halo.app:api'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

test {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release = 21
    options.compilerArgs << '-parameters'
}

node {
    download = true
    version = '24.14.0'
    pnpmVersion = '10.22.0'
    nodeProjectDir = file("${project.projectDir}/ui")
}

tasks.register('buildFrontend', PnpmTask) {
    args = ['build']
    dependsOn('installDepsForUI')
}

tasks.register('syncWidgetResources', Copy) {
    dependsOn('installDepsForUI')
    from(layout.projectDirectory.dir('widget/src'))
    from(layout.projectDirectory.file('ui/node_modules/jsqr/dist/jsQR.js')) {
        into('vendor')
    }
    from(layout.projectDirectory.file('ui/node_modules/jsqr/LICENSE')) {
        into('vendor')
        rename { 'jsQR.LICENSE.txt' }
    }
    into(layout.projectDirectory.dir('src/main/resources/static'))
    doLast {
        def licenseFile = layout.projectDirectory
            .file('src/main/resources/static/vendor/jsQR.LICENSE.txt').asFile
        licenseFile.setText(
            licenseFile.getText('UTF-8').stripTrailing() + System.lineSeparator(),
            'UTF-8'
        )
    }
}

tasks.register('typecheckFrontend', PnpmTask) {
    args = ['typecheck']
    dependsOn('installDepsForUI')
}

tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = 'Verify plugin and UI versions match the Gradle project version.'
    inputs.files(
        layout.projectDirectory.file('src/main/resources/plugin.yaml'),
        layout.projectDirectory.file('ui/package.json')
    )
    doLast {
        def expectedVersion = project.version.toString()
        def pluginYaml = layout.projectDirectory
            .file('src/main/resources/plugin.yaml').asFile.getText('UTF-8')
        def versionMatcher = pluginYaml =~ /(?m)^\s{2}version:\s*["']?([^"'\s]+)["']?\s*$/
        if (!versionMatcher.find()) {
            throw new GradleException('Unable to read spec.version from plugin.yaml')
        }
        def pluginVersion = versionMatcher.group(1)
        def uiPackage = new groovy.json.JsonSlurper().parse(
            layout.projectDirectory.file('ui/package.json').asFile
        )
        def uiVersion = uiPackage.version.toString()
        if (pluginVersion != expectedVersion || uiVersion != expectedVersion) {
            throw new GradleException(
                "Version mismatch: Gradle=${expectedVersion}, plugin.yaml=${pluginVersion}, ui/package.json=${uiVersion}"
            )
        }
    }
}

tasks.register('installDepsForUI', PnpmTask) {
    args = ['install', '--frozen-lockfile']
}

tasks.named('compileJava') {
    dependsOn('buildFrontend')
}

tasks.named('processResources') {
    dependsOn('syncWidgetResources')
}

tasks.named('check') {
    dependsOn('typecheckFrontend')
    dependsOn('verifyVersionConsistency')
}

halo {
    version = '2.23.0'
}

haloPlugin {
    openApi {
        outputDir = file("$rootDir/api-docs/openapi/v3_0")
        groupingRules {
            membersV1alpha1Api {
                displayName = 'Extension API for Members'
                pathsToMatch = [
                    '/apis/member.plugin.halo.run/v1alpha1/members/**',
                    '/apis/member.plugin.halo.run/v1alpha1/membergroups/**',
                    '/apis/api.plugin.halo.run/v1alpha1/plugins/PluginMembers/**',
                    '/apis/console.api.member.plugin.halo.run/v1alpha1/**'
                ]
            }
        }
        groupedApiMappings = [
                '/v3/api-docs/membersV1alpha1Api': 'membersV1alpha1Api.json'
        ]
        generator {
            outputDir = file("${projectDir}/ui/src/api/generated")
        }
    }
}
